<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - SVG House</title>
</head>

<body>

    <h1>My SVG House and Garden</h1>

    <svg width="800" height="600" viewBox="0 0 800 600">

        <!-- Background -->
        <rect x="0" y="0" width="800" height="600" fill="lightblue"/>

        <!-- Sun - Circle -->
        <circle cx="700" cy="80" r="60" fill="yellow" stroke="orange" stroke-width="4"/>

        <!-- Clouds - Ellipses -->
        <ellipse cx="150" cy="100" rx="70" ry="35" fill="white"/>
        <ellipse cx="210" cy="100" rx="60" ry="30" fill="white"/>

        <!-- Ground -->
        <rect x="0" y="400" width="800" height="200" fill="mediumseagreen"/>

        <!-- House Body -->
        <rect x="250" y="250" width="300" height="200"
              fill="lightcoral" stroke="brown" stroke-width="6"/>

        <!-- Roof - Polygon -->
        <polygon points="220,250 400,100 580,250"
                 fill="darkred" stroke="darkred" stroke-width="6"/>

        <!-- Chimney -->
        <rect x="480" y="150" width="45" height="100"
              fill="darkblue" stroke="black" stroke-width="4"/>

        <!-- Door -->
        <rect x="370" y="330" width="60" height="120"
              fill="darkblue" stroke="black" stroke-width="4"/>

        <!-- Door Knob - Circle -->
        <circle cx="415" cy="390" r="6" fill="gold"/>

        <!-- Left Window -->
        <rect x="280" y="290" width="70" height="60"
              fill="deepskyblue" stroke="black" stroke-width="4"/>

        <!-- Window Cross -->
        <line x1="315" y1="290" x2="315" y2="350"
              stroke="black" stroke-width="3"/>
        <line x1="280" y1="320" x2="350" y2="320"
              stroke="black" stroke-width="3"/>

        <!-- Right Window -->
        <rect x="450" y="290" width="70" height="60"
              fill="deepskyblue" stroke="navy" stroke-width="5"/>

        <!-- Window Cross -->
        <line x1="485" y1="290" x2="485" y2="350"
              stroke="black" stroke-width="3"/>
        <line x1="450" y1="320" x2="520" y2="320"
              stroke="navy" stroke-width="5"/>

        <!-- Tree Trunk -->
        <rect x="80" y="330" width="40" height="120"
              fill="saddlebrown" stroke="black" stroke-width="3"/>

        <!-- Tree Leaves - Circle -->
        <circle cx="100" cy="290" r="65"
                fill="darkgreen" stroke="darkgreen" stroke-width="3"/>

        <!-- Tree Leaves - Additional Circle -->
        <circle cx="60" cy="315" r="45"
                fill="forestgreen"/>

        <!-- Tree Leaves - Additional Circle -->
        <circle cx="140" cy="315" r="45"
                fill="forestgreen"/>

        <!-- Garden Path - Path -->
        <path d="M 370 450 L 430 450 L 500 600 L 300 600 Z"
              fill="tan" stroke="black" stroke-width="2"/>

        <!-- Flower 1 Stem -->
        <line x1="650" y1="450" x2="650" y2="520"
              stroke="purple" stroke-width="4"/>

        <!-- Flower 1 -->
        <circle cx="650" cy="440" r="12" fill="red"/>
        <circle cx="635" cy="440" r="12" fill="red"/>
        <circle cx="665" cy="440" r="12" fill="red"/>
        <circle cx="650" cy="425" r="12" fill="red"/>
        <circle cx="650" cy="455" r="12" fill="red"/>
        <circle cx="650" cy="440" r="7" fill="yellow"/>

        <!-- Flower 2 Stem -->
        <line x1="720" y1="450" x2="720" y2="520"
              stroke="purple" stroke-width="4"/>

        <!-- Flower 2 -->
        <circle cx="720" cy="440" r="12" fill="purple"/>
        <circle cx="705" cy="440" r="12" fill="purple"/>
        <circle cx="735" cy="440" r="12" fill="purple"/>
        <circle cx="720" cy="425" r="12" fill="purple"/>
        <circle cx="720" cy="455" r="12" fill="purple"/>
        <circle cx="720" cy="440" r="7" fill="yellow"/>

        <!-- Fence -->
        <polyline points="550,420 580,390 610,420 640,390 670,420 700,390 730,420"
                  fill="none" stroke="white" stroke-width="8"/>

        <!-- House Label - Text -->
        <text x="325" y="490"
              font-size="24"
              fill="black">
            My House
        </text>

    </svg>

</body>
</html>
